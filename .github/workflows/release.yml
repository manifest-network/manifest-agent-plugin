name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          # Dereference the tag ref to its target commit so we compare commits,
          # not tag objects. Works for both lightweight and annotated tags.
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag $GITHUB_REF_NAME resolves to commit $TAG_COMMIT, which is not reachable from origin/main — refusing to release" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME resolves to commit $TAG_COMMIT, reachable from main"

      - name: Verify tag matches manifest versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          CODEX=$(node -p "require('./hosts/codex/manifest-agent/.codex-plugin/plugin.json').version")
          LOCK=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$PLUGIN" ] || [ "$TAG" != "$CODEX" ] || [ "$TAG" != "$LOCK" ]; then
            echo "Version mismatch: tag=$TAG package=$PKG Claude=$PLUGIN Codex=$CODEX lock=$LOCK" >&2
            exit 1
          fi
          echo "All versions match: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  codex-artifact:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check whether Codex publication evidence is complete
        id: acceptance
        run: node ci/host-acceptance.cjs --codex-release-status --fetch-history >> "$GITHUB_OUTPUT"

      - name: Install the characterized Codex host
        if: steps.acceptance.outputs.eligible == 'true'
        run: npm install --global @openai/codex@0.153.4

      - name: Verify fresh Codex host evidence for the archive
        if: steps.acceptance.outputs.eligible == 'true'
        run: |
          node ci/codex-host-smoke.cjs --out codex-host-report.json
          node ci/host-acceptance.cjs --report codex-host-report.json --require-current

      - name: Build the native Codex release archive
        if: steps.acceptance.outputs.eligible == 'true'
        run: |
          npm run build:codex
          tar -czf "manifest-agent-codex-${GITHUB_REF_NAME}.tar.gz" -C dist codex

      - name: Attach the accepted Codex archive
        if: steps.acceptance.outputs.eligible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: manifest-agent-codex-*.tar.gz
