name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check CJS scripts
        run: |
          shopt -s nullglob
          files=(scripts/*.cjs ci/*.cjs tests/fixtures/*.cjs)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no CJS scripts found in scripts/, ci/, or tests/fixtures/" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            node --check "$f"
          done

      - name: Syntax-check shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done

      - name: Parse PowerShell scripts without running Windows APIs
        shell: pwsh
        run: ./ci/check-powershell.ps1

      - name: Validate JSON manifests
        run: |
          mapfile -t files < <(git ls-files '*.json')
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: no tracked JSON files found — checkout or working directory is wrong" >&2
            exit 1
          fi
          echo "Validating ${#files[@]} JSON file(s)"
          status=0
          for f in "${files[@]}"; do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then
              echo "Invalid JSON: $f" >&2
              status=1
            fi
          done
          exit $status

      - name: Check release evidence schema and host statuses
        # Pending and older-version records are valid here; publication checks source eligibility.
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const record = require('./docs/host-acceptance-release.json');
          require('./ci/host-acceptance.cjs').codexReleaseCandidate(record);
          for (const kind of ['interactive', 'testnet']) {
            assert.ok(['pending', 'complete'].includes(record.hosts?.claude?.[kind]?.status), `Invalid claude/${kind} evidence status`);
          }
          NODE

      - name: Verify version consistency across manifests
        run: |
          PKG=$(node -p "require('./package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          CODEX=$(node -p "require('./hosts/codex/manifest-agent/.codex-plugin/plugin.json').version")
          LOCK=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$PKG" != "$PLUGIN" ] || [ "$PKG" != "$CODEX" ] || [ "$PKG" != "$LOCK" ]; then
            echo "Version mismatch: package=$PKG Claude=$PLUGIN Codex=$CODEX lock=$LOCK" >&2
            exit 1
          fi
          echo "Both host manifests and runtime at version $PKG"

      - name: Verify shared skills and build the native Codex package
        run: npm run build:codex

      - name: Verify recorded host evidence provenance
        run: |
          node ci/evidence-check.cjs --fetch-history --require-history
          node ci/host-acceptance.cjs --require-history
          for report in docs/host-evidence/*-terminal*.json; do
            node ci/terminal-host-smoke.cjs --check "$report" --require-history
          done

      - name: Verify PreToolUse policy completeness (matcher tools named in policy + CLAUDE.md parity)
        # Checks the dependency-free matcher / runtime policy / docs contract.
        # Installed server coverage is verified with tools/list below.
        run: npm run test:policy-completeness

      - name: Verify session-start policy is emitted and references fee estimation
        run: |
          out=$(bash scripts/session-start.sh)
          if [ -z "$out" ]; then
            echo "session-start.sh produced no stdout" >&2
            exit 1
          fi
          if ! grep -q "cosmos_estimate_fee" <<<"$out"; then
            echo "session-start.sh policy is missing the cosmos_estimate_fee rule" >&2
            exit 1
          fi
          echo "session-start.sh policy emitted ($(wc -c <<<"$out") bytes)"

      - name: Install the locked runtime using the plugin setup command
        run: MANIFEST_PLUGIN_DATA="$HOME/.manifest-agent" node scripts/setup-runtime.cjs

      - name: Verify MCP binaries and NODE_PATH resolution
        run: |
          for bin in manifest-mcp-chain manifest-mcp-lease manifest-mcp-fred manifest-mcp-cosmwasm manifest-mcp-agent; do
            path="$HOME/.manifest-agent/node_modules/.bin/$bin"
            if [ ! -x "$path" ]; then
              echo "Missing or non-executable MCP binary: $path" >&2
              exit 1
            fi
          done
          NODE_PATH="$HOME/.manifest-agent/node_modules" node -e "require('@cosmjs/proto-signing'); console.log('NODE_PATH resolution ok')"

      - name: Verify permission coverage against installed MCP tools
        # Starts the pinned servers offline and sends initialize/tools/list only.
        run: node ci/mcp-tool-policy.cjs --data-dir "$HOME/.manifest-agent"

      - name: Verify lease-state mapping against installed manifestjs
        run: node ci/lease-state-parity.cjs --data-dir "$HOME/.manifest-agent"

      - name: Verify published servers through the real launcher
        run: node ci/launcher-transport.cjs --data-dir "$HOME/.manifest-agent"

      - name: Verify both host launchers and pinned workflow contracts
        run: node ci/host-contracts.cjs --data-dir "$HOME/.manifest-agent"

      - name: Run unit tests
        # Tests use `node:test` + `node:assert` (no test framework dep). The
        # NODE_PATH points at the same install populated above so any future
        # test that requires() a runtime dep resolves the same way the
        # plugin's MCP wrapper does at runtime.
        run: NODE_PATH="$HOME/.manifest-agent/node_modules" node --test tests/*.test.cjs

      - name: Verify executable docs (docs-ci)
        # ENG-213 Check 1. Runs the `docs-ci`-tagged shell examples in
        # docs/testing.md, each in an isolated tempdir, and asserts the
        # documented expect/expect-not directives hold. MUST run after the
        # "Install runtime deps" step: the render-balance example resolves
        # ./humanize-denom.cjs and the gen-agent-key example needs
        # @cosmjs/proto-signing, both via NODE_PATH (same as Run unit tests
        # above). `network`-tagged blocks are inventoried-but-skipped unless
        # DOCS_CI_RUN_NETWORK=1.
        run: NODE_PATH="$HOME/.manifest-agent/node_modules" npm run test:docs

      - name: Upload native Codex package
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-agent-codex
          path: dist/codex
          include-hidden-files: true

  codex-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the characterized Codex host
        run: npm install --global @openai/codex@0.153.4
      - name: Exercise native discovery and form confirmation with harmless fixtures
        run: node ci/codex-host-smoke.cjs --out codex-host-report.json
      - name: Verify fresh evidence against this checkout
        run: node ci/host-acceptance.cjs --report codex-host-report.json --require-current
      - uses: actions/upload-artifact@v4
        with:
          name: codex-host-report
          path: codex-host-report.json
